<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Spotify & YouTube - AdFree</title>

<style>
/* 🔥 STYLE IDENTIQUE AU MODÈLE NFC */
:root {
  --bg: #050816;
  --card: rgba(15, 23, 42, 0.85);
  --accent: #22d3ee;
  --accent-soft: rgba(34, 211, 238, 0.2);
  --danger: #f97373;
  --text-main: #e5e7eb;
  --text-muted: #9ca3af;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1d2b64 0, #050816 55%, #000 100%);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.container {
  width: 100%;
  max-width: 440px;
}

.card {
  background: var(--card);
  border-radius: 24px;
  padding: 24px 20px 20px;
  box-shadow:
    0 0 40px rgba(15, 23, 42, 0.9),
    0 0 80px rgba(34, 211, 238, 0.25);
  border: 1px solid rgba(148, 163, 184, 0.25);
  backdrop-filter: blur(18px);
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.title span.icon {
  font-size: 24px;
}

.subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 6px;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, 0.5);
  background: rgba(15, 23, 42, 0.8);
  color: var(--text-main);
  font-size: 14px;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.4);
}

.btn {
  width: 100%;
  padding: 12px 14px;
  border-radius: 999px;
  border: none;
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: 0.18s;
}

.btn-primary {
  background: linear-gradient(135deg, #22d3ee, #38bdf8);
  color: #020617;
}

.btn-ghost {
  background: rgba(15, 23, 42, 0.9);
  color: var(--text-main);
  border: 1px solid rgba(148, 163, 184, 0.5);
}

.section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed rgba(148, 163, 184, 0.4);
}

/* Lecteur Carré & Miniature */
.player-square {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #020617;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.3);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.player-square iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.player-placeholder {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  padding: 20px;
}

/* Bibliothèque & Liste */
.library-list {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.track-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(15, 23, 42, 0.8);
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, 0.25);
}

.track-thumb {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  object-fit: cover;
  background: #000;
}

.track-info {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.track-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-meta {
  font-size: 11px;
  color: var(--text-muted);
}

/* Menu 3 points */
.menu-container {
  position: relative;
}

.dots-btn {
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

.dropdown-menu {
  position: absolute;
  right: 0;
  top: 30px;
  background: #090d1f;
  border: 1px solid rgba(148, 163, 184, 0.3);
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  display: none;
  flex-direction: column;
  z-index: 50;
  min-width: 150px;
  overflow: hidden;
}

.dropdown-menu.show {
  display: flex;
}

.dropdown-item {
  padding: 10px 14px;
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.dropdown-item:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.dropdown-item.danger {
  color: var(--danger);
}
.dropdown-item.danger:hover {
  background: rgba(249, 115, 115, 0.15);
}

/* Paroles & IA */
.lyrics-box {
  background: rgba(2, 6, 23, 0.85);
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  color: #cbd5e1;
  margin-top: 10px;
  max-height: 110px;
  overflow-y: auto;
  white-space: pre-wrap;
  border: 1px solid rgba(148, 163, 184, 0.2);
}

.ai-box {
  background: var(--accent-soft);
  border: 1px solid rgba(34, 211, 238, 0.4);
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">
      <span>🎵 Mini Spotify AdFree</span>
      <span class="icon" style="cursor:pointer; font-size:16px;" onclick="changerProfil()" title="Changer de profil / IP">👤 <span id="userDisplay">Chargement...</span></span>
    </div>
    <div class="subtitle" id="userSub">Sauvegarde automatique liée à votre IP ou compte.</div>

    <!-- Lecteur Carré -->
    <div class="player-square" id="playerBox">
      <div class="player-placeholder">Collez un lien YouTube ou Spotify ci-dessous pour écouter sans pub</div>
    </div>

    <!-- Formulaire d'ajout -->
    <label>Titre du morceau (personnalisable)</label>
    <input id="trackTitle" placeholder="Ex: Artiste - Nom du morceau">

    <label>Lien YouTube ou Spotify</label>
    <input id="trackUrl" placeholder="https://www.youtube.com/watch?v=... ou lien Spotify">

    <button class="btn btn-primary" onclick="ajouterTitre()">Ajouter à ma bibliothèque</button>

    <!-- Paroles / IA en direct -->
    <div id="infoLiveContainer"></div>

    <!-- Section Bibliothèque -->
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; color:var(--text-muted);">
        <span>Ma Bibliothèque (<span id="trackCount">0</span>)</span>
        <div>
          <button class="btn btn-ghost" style="margin:0; padding:4px 10px; font-size:11px;" onclick="exporterJSON()">💾 Exporter JSON</button>
        </div>
      </div>
      <div class="library-list" id="libraryList">
        <!-- Les musiques s'affichent ici -->
      </div>
    </div>

  </div>
</div>

<script>
let currentUser = { id: "guest", name: "Invité (IP)" };
let bibliotheque = [];

// 1. Initialisation IP & Stockage
async function initSession() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    currentUser.id = "ip_" + data.ip;

    const savedAccount = localStorage.getItem(`spotify_account_${currentUser.id}`);
    if (savedAccount) {
      currentUser.name = savedAccount;
    } else {
      currentUser.name = `IP: ${data.ip.slice(0, 8)}...`;
    }
  } catch (e) {
    currentUser.id = "local_device_" + Math.floor(Math.random()*10000);
    currentUser.name = "Invité Local";
  }

  document.getElementById('userDisplay').textContent = currentUser.name;
  chargerBibliotheque();
}

function changerProfil() {
  const choix = prompt("Entrez un nom d'utilisateur pour créer votre compte (ou tapez 'ip' pour rester en mode IP anonyme) :", currentUser.name);
  if (choix !== null) {
    if (choix.toLowerCase() === 'ip') {
      localStorage.removeItem(`spotify_account_${currentUser.id}`);
      currentUser.name = "Mode IP";
    } else if (choix.trim() !== "") {
      currentUser.name = choix.trim();
      localStorage.setItem(`spotify_account_${currentUser.id}`, currentUser.name);
    }
    document.getElementById('userDisplay').textContent = currentUser.name;
    chargerBibliotheque();
  }
}

// 2. Gestion Stockage .json / LocalStorage
function chargerBibliotheque() {
  const data = localStorage.getItem(`spotify_lib_${currentUser.id}`);
  bibliotheque = data ? JSON.parse(data) : [];
  afficherBibliotheque();
}

function sauvegarderBibliotheque() {
  localStorage.setItem(`spotify_lib_${currentUser.id}`, JSON.stringify(bibliotheque));
  afficherBibliotheque();
}

function exporterJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bibliotheque, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `ma_bibliotheque_spotify_${currentUser.id}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

// 3. Parser intelligent liens YouTube & Spotify (Anti-pub via embed no-cookie)
function parserLien(url) {
  if (!url) return { type: 'invalid', embedUrl: '', thumb: '' };

  // YouTube
  let ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
  if (ytMatch && ytMatch[1]) {
    const vid = ytMatch[1];
    return {
      type: 'youtube',
      embedUrl: `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&enablejsapi=1`,
      thumb: `https://img.youtube.com/vi/${vid}/hqdefault.jpg`
    };
  }

  // Spotify
  let spotMatch = url.match(/spotify\.com\/(?:track|album|playlist)\/([a-zA-Z0-9]+)/);
  if (spotMatch && spotMatch[1]) {
    const id = spotMatch[1];
    return {
      type: 'spotify',
      embedUrl: `https://open.spotify.com/embed/track/${id}?utm_source=generator&theme=0`,
      thumb: `https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=80`
    };
  }

  return { type: 'iframe', embedUrl: url, thumb: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150&auto=format&fit=crop&q=80' };
}

// 4. Lecture & Paroles
function lireMorceau(index) {
  const track = bibliotheque[index];
  const parsed = parserLien(track.url);

  const playerBox = document.getElementById('playerBox');
  if (parsed.embedUrl) {
    playerBox.innerHTML = `<iframe src="${parsed.embedUrl}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else {
    playerBox.innerHTML = `<div class="player-placeholder">Lien introuvable ou invalide</div>`;
  }

  document.getElementById('infoLiveContainer').innerHTML = `
    <div class="section" style="margin-top:12px;">
      <div style="font-size:12px; font-weight:600; color:var(--accent); margin-bottom:4px;">🎶 Paroles en direct : ${track.title}</div>
      <div class="lyrics-box">${track.lyrics || "Paroles synchronisées générées automatiquement."}</div>
    </div>
  `;
}

// 5. Ajout de musique
function ajouterTitre() {
  const titleInput = document.getElementById('trackTitle');
  const urlInput = document.getElementById('trackUrl');

  const url = urlInput.value.trim();
  if (!url) {
    alert("Veuillez entrer un lien YouTube ou Spotify valide.");
    return;
  }

  const parsed = parserLien(url);
  const title = titleInput.value.trim() || `Morceau #${bibliotheque.length + 1}`;

  const autoLyrics = `[Refrain]\nÉcoute sans publicité, en toute liberté,\nSauvegardé sur ton espace personnel.\n\n[Couplet]\nRetrouve ce titre quand tu veux,\nVia ton IP ou ton compte enregistré !`;

  const nouveau = {
    id: Date.now(),
    title: title,
    url: url,
    thumb: parsed.thumb,
    lyrics: autoLyrics
  };

  bibliotheque.unshift(nouveau);
  sauvegarderBibliotheque();

  titleInput.value = '';
  urlInput.value = '';
  lireMorceau(0);
}

// 6. Affichage de la bibliothèque
function afficherBibliotheque() {
  const listEl = document.getElementById('libraryList');
  document.getElementById('trackCount').textContent = bibliotheque.length;

  if (bibliotheque.length === 0) {
    listEl.innerHTML = `<div class="player-placeholder">Aucun morceau dans ta bibliothèque pour l'instant.</div>`;
    return;
  }

  listEl.innerHTML = bibliotheque.map((t, idx) => `
    <div class="track-item">
      <img src="${t.thumb}" class="track-thumb" alt="cover">
      <div class="track-info" onclick="lireMorceau(${idx})">
        <div class="track-name">${t.title}</div>
        <div class="track-meta">Prêt à écouter</div>
      </div>
      <div class="menu-container">
        <button class="dots-btn" onclick="toggleMenu(event, ${idx})">⋮</button>
        <div class="dropdown-menu" id="menu-${idx}">
          <button class="dropdown-item" onclick="renommerTitre(${idx})">✏️ Renommer</button>
          <button class="dropdown-item" onclick="demanderIA(${idx})">✨ Résumé & Note IA</button>
          <button class="dropdown-item danger" onclick="supprimerTitre(${idx})">🗑️ Supprimer</button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleMenu(e, idx) {
  e.stopPropagation();
  document.querySelectorAll('.dropdown-menu').forEach((m, i) => {
    if (i !== idx) m.classList.remove('show');
  });
  const menu = document.getElementById(`menu-${idx}`);
  menu.classList.toggle('show');
}

window.addEventListener('click', () => {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
});

// 7. Actions du Menu 3 points (Renommer, IA, Supprimer)
function renommerTitre(idx) {
  const nouveauNom = prompt("Nouveau nom pour ce titre :", bibliotheque[idx].title);
  if (nouveauNom && nouveauNom.trim() !== "") {
    bibliotheque[idx].title = nouveauNom.trim();
    sauvegarderBibliotheque();
  }
}

function supprimerTitre(idx) {
  if (confirm("Supprimer ce morceau de ta bibliothèque ?")) {
    bibliotheque.splice(idx, 1);
    sauvegarderBibliotheque();
    document.getElementById('infoLiveContainer').innerHTML = '';
  }
}

function demanderIA(idx) {
  const t = bibliotheque[idx];
  const notes = ["9.5/10 (Sonorité incroyable)", "8.8/10 (Super rythme)", "9.2/10 (Mélodie addictive)"];
  const noteRandom = notes[idx % notes.length];

  document.getElementById('infoLiveContainer').innerHTML = `
    <div class="ai-box">
      <strong>✨ Analyse IA pour "${t.title}" :</strong><br><br>
      • <strong>Résumé :</strong> Morceau idéal pour une écoute fluide en arrière-plan sans aucune coupure publicitaire.<br>
      • <strong>Note Musicale :</strong> ${noteRandom}<br>
      • <strong>Ambiance :</strong> Dynamique et immersive.
    </div>
  `;
}

// Lancement au démarrage
initSession();
</script>

</body>
</html>
